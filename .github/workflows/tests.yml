name: Unit and acceptance tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    name: Windows unit and acceptance
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and acceptance suites (no game files)
        run: python tools/run_tests.py --suite all
